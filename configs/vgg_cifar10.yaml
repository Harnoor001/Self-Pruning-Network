# Stage B: VGG-16-BN on CIFAR-10.
extends: [pruning.yaml]
name: vgg16
output_root: artifacts/research/vgg16
model: {family: vgg, cfg: vgg16, num_classes: 10}
data: {data_dir: data, batch_size: 128, num_workers: 4, augmentation: standard, split_mode: fixed, split_seed: 0,
       calibration_size: 2048, eval_batch_size: 1000}
train:
  epochs: 160
  optimizer: sgd
  lr: 0.05
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0005
  gate_weight_decay: 0.0           # documented deviation: SGD weight decay would dominate gate dynamics
  scheduler: cosine
  label_smoothing: 0.0
  amp: true
sources:
  dense: {objective: dense}
  gated: {objective: gated, train: {gate_lambda: 0.0, gate_penalty_norm: sum}}
  slimming: {objective: slimming, train: {slimming_lambda: 0.0001}}
pruning: {min_keep: 8}
fine_tune: {epochs: 20, optimizer: sgd, lr: 0.01, momentum: 0.9, nesterov: true, weight_decay: 0.0005, scheduler: cosine,
            label_smoothing: 0.0, amp: true}
