# Shared pruning / evaluation protocol (research/experimental_protocol.md).
deterministic: true
device: auto
seeds: [42, 123, 2024, 7, 21]      # final; pilot runs pass --seeds 42 123 2024
pilot_seeds: [42, 123, 2024]

pruning:
  ratios: [0.2, 0.4, 0.6]
  min_keep: 1
  controls: true                    # unpruned source + identical fine-tuning (budget control)
  save_compact_checkpoints: false   # set true to keep every fine-tuned compact model
  methods:
    # primary comparison: every criterion on the SAME gated source
    - random@gated
    - l1@gated
    - l2@gated
    - activation@gated
    - taylor@gated
    - gate_in@gated                 # existing method (Method 6)
    - gate_out@gated                # variant V1
    - gate_combined@gated           # variant V2
    - bn_gamma@gated                # diagnostic
    # training-objective effect: post-training criteria on the dense source
    - random@dense
    - l1@dense
    - l2@dense
    - activation@dense
    - taylor@dense
    # Network Slimming (separately trained source)
    - slimming@slimming
    - slimming@slimming:global

reliability:
  sources: [gated, dense, slimming]
  criteria: [random, l1, l2, activation, taylor, gate_in, gate_out, gate_combined, bn_gamma, l1_in]
  units_per_layer: 64

benchmark:
  cpu_threads: 1
  cpu_batch_sizes: [1, 64]
  gpu_batch_sizes: [1, 256]
  warmup: 20
  iterations: 100

ablation:
  # A. gate regularisation strength / normalisation (existing penalty = 'sum')
  gate_lambda:
    sources:
      gated_lam1e-6_sum: {objective: gated, train: {gate_lambda: 1.0e-6, gate_penalty_norm: sum}}
      gated_lam1e-5_sum: {objective: gated, train: {gate_lambda: 1.0e-5, gate_penalty_norm: sum}}
      gated_lam1e-4_sum: {objective: gated, train: {gate_lambda: 1.0e-4, gate_penalty_norm: sum}}
      gated_lam1e-3_sum: {objective: gated, train: {gate_lambda: 1.0e-3, gate_penalty_norm: sum}}
      gated_lam1e-1_mean: {objective: gated, train: {gate_lambda: 0.1, gate_penalty_norm: mean}}
      gated_lam1e+0_mean: {objective: gated, train: {gate_lambda: 1.0, gate_penalty_norm: mean}}
    criteria: [gate_in, gate_out, gate_combined, random]
    ratios: [0.4]
  # B. gate aggregation is part of the main comparison (gate_in / gate_out / gate_combined).
  # C. fine-tuning budget
  fine_tune:
    epochs: [0, 1, 3, 5]
    methods: [random@gated, l1@gated, taylor@gated, gate_in@gated, gate_combined@gated, slimming@slimming]
    ratios: [0.2, 0.4, 0.6]
  # D (ratios) and E (seeds) are covered by the main comparison.
